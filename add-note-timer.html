<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a Note</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #004a98; --blue-hover: #003a78; --text: #333; --muted: #666; --error: #b3261e; --ok: #2e7d32; --border: #a9a9a9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Poppins", Arial, sans-serif; color: var(--text); background: #7a7a7a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; width: 100%; max-width: 1300px; border-radius: 4px; padding: 24px 32px; position: relative; }
  .modal h1 { color: var(--blue); font-size: 28px; font-weight: 700; margin: 0 0 24px; }
  .close { position: absolute; top: 20px; right: 28px; width: 32px; height: 32px; border: 2px solid var(--blue); border-radius: 50%; background: none; color: var(--blue); font-size: 18px; cursor: pointer; line-height: 1; }
  .form { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px 16px; align-items: center; font-size: 16px; }
  .form > label, .form > .label { font-weight: 500; }
  .req { color: var(--error); }
  input, select, textarea { font: inherit; font-size: 15px; border: 1px solid var(--border); padding: 4px 6px; border-radius: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  textarea { width: 100%; max-width: 1000px; min-height: 180px; resize: vertical; }
  .time-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .sub { font-size: 14px; color: var(--muted); }
  .stepper { display: inline-flex; }
  .stepper input { width: 64px; text-align: center; border-radius: 0; border-left: 0; border-right: 0; appearance: textfield; -moz-appearance: textfield; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .step { width: 32px; font: inherit; font-size: 18px; line-height: 1; border: 1px solid var(--border); background: #f4f4f4; color: var(--text); cursor: pointer; }
  .step:first-child { border-radius: 2px 0 0 2px; }
  .step:last-child { border-radius: 0 2px 2px 0; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 14px; padding: 4px 12px; border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 999px; cursor: pointer; }
  .chip.selected { background: var(--blue); color: #fff; }
  .chip:disabled, .step:disabled { opacity: .45; cursor: not-allowed; }
  .timer-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 500; padding: 5px 14px; border: 2px solid var(--blue); background: #fff; color: var(--blue); border-radius: 4px; cursor: pointer; }
  .timer-btn.running { border-color: var(--error); color: var(--error); }
  .duration { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .duration strong { color: var(--text); font-weight: 500; }
  .duration em { font-style: normal; }
  .hint { margin-left: 10px; }
  .err { display: block; font-size: 13px; color: var(--error); margin-top: 4px; }
  .err:empty { display: none; }
  .actions { border-top: 3px solid #aaa; margin-top: 28px; padding-top: 10px; display: flex; justify-content: center; gap: 6px; }
  .actions button { font: inherit; font-size: 18px; font-weight: 700; min-width: 176px; height: 64px; border-radius: 4px; cursor: pointer; }
  .btn-cancel { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
  .btn-submit { background: var(--blue); color: #fff; border: 2px solid var(--blue); }
  .btn-submit:hover { background: var(--blue-hover); }
  .saved { text-align: center; color: var(--ok); font-size: 14px; min-height: 1.2em; margin: 10px 0 0; }
  @media (max-width: 640px) { .form { grid-template-columns: 1fr; } .actions button { min-width: 0; flex: 1; } .hint { display: block; margin: 4px 0 0; } }
</style>
</head>
<body>
<div class="modal" role="dialog" aria-labelledby="title">
  <button class="close" id="closeBtn" aria-label="Close">&#x2715;</button>
  <h1 id="title">Add a Note</h1>

  <div class="form">
    <span class="label">Patient:</span>
    <span>SStestCernerCST25_2, SStestCernerCST25_2</span>

    <label for="noteDate">Date:<span class="req">*</span></label>
    <div><input id="noteDate" type="date" value="2026-10-05"></div>

    <label for="contactType">Contact type:<span class="req">*</span></label>
    <div>
      <select id="contactType">
        <option value="">Select type</option>
        <option>Phone</option>
        <option>VVC</option>
        <option>In person</option>
        <option>Portal message</option>
        <option>Other</option>
      </select>
      <span class="err" id="errType"></span>
    </div>

    <label for="noteTitle">Note title:<span class="req">*</span></label>
    <div>
      <select id="noteTitle">
        <option value="">Select note title</option>
        <option>RPM-HT Tech Education Note/Template</option>
        <option>RPM-HT L2 Tech Education Note/Template</option>
        <option>RPM-HT Intervention Note Template</option>
        <option>RPM-HT L2 Intervention Note/Template</option>
        <option>RPM-HT Provider Notification</option>
        <option>RPM-HT Assessment Treatment Plan Note/Template</option>
        <option>RPM-HT L2 Assessment Treatment Plan Note/Template</option>
        <option>RPM-HT Periodic Evaluation</option>
        <option>RPM-HT Continuum of Care</option>
        <option>RPM-HT Note</option>
        <option>RPM-HT Discharge Note</option>
      </select>
      <span class="err" id="errTitle"></span>
    </div>

    <label for="minutes">Time spent:<span class="req">*</span></label>
    <div>
      <div class="time-row">
        <div class="stepper">
          <button type="button" class="step" id="minusBtn" aria-label="Subtract 1 minute">&minus;</button>
          <input id="minutes" type="number" min="1" step="1" inputmode="numeric">
          <button type="button" class="step" id="plusBtn" aria-label="Add 1 minute">+</button>
        </div>
        <span class="sub">min</span>
        <div class="chips" role="group" aria-label="Quick durations">
          <button type="button" class="chip" data-min="5">5 min</button>
          <button type="button" class="chip" data-min="10">10 min</button>
          <button type="button" class="chip" data-min="15">15 min</button>
          <button type="button" class="chip" data-min="20">20 min</button>
          <button type="button" class="chip" data-min="30">30 min</button>
        </div>
        <span class="sub">or</span>
        <button type="button" class="timer-btn" id="timerBtn">&#9654; Start timer</button>
      </div>
      <div class="duration" id="timeSummary">&ndash;</div>
      <span class="err" id="errTime"></span>
    </div>

    <label for="startHour">Start time:</label>
    <div class="time-row">
      <select id="startHour" aria-label="Start hour"><option value="">--</option></select>
      <select id="startMinute" aria-label="Start minute"><option value="">--</option></select>
      <select id="startPeriod" aria-label="AM or PM"><option value="">--</option><option>AM</option><option>PM</option></select>
      <span class="sub" id="startHint">Filled in as the current time minus time spent. Change it if the visit ended earlier.</span>
    </div>

    <label for="comments" style="align-self:start;padding-top:4px">Comments:<span class="req">*</span></label>
    <div>
      <textarea id="comments"></textarea>
      <span class="err" id="errComments"></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
    <button type="button" class="btn-submit" id="submitBtn">Submit</button>
  </div>
  <p class="saved" id="saved" aria-live="polite"></p>
</div>

<script>
  const $ = id => document.getElementById(id);
  const minEl = $('minutes'), timerBtn = $('timerBtn'), summaryEl = $('timeSummary');
  const chips = [...document.querySelectorAll('.chip')], steps = [$('minusBtn'), $('plusBtn')];
  let timerId = null, timerStart = null, startSource = null; // startSource: 'auto' | 'timer' | 'entered'

  const pad = n => String(n).padStart(2, '0');
  const wrap = t => ((t % 1440) + 1440) % 1440;
  const toTimeValue = t => `${pad(Math.floor(wrap(t) / 60))}:${pad(wrap(t) % 60)}`;
  const fmt12 = t => { const h = Math.floor(wrap(t) / 60), m = wrap(t) % 60; return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const getMinutes = () => { const n = Number(minEl.value); return minEl.value !== '' && Number.isInteger(n) && n > 0 ? n : null; };

  // Start time dropdowns: hour (1-12), minute (00-59), AM/PM. Values are minutes since midnight.
  const startSel = ['startHour', 'startMinute', 'startPeriod'].map($), [hourEl, minuteEl, periodEl] = startSel;
  for (let h = 1; h <= 12; h++) hourEl.add(new Option(h, h));
  for (let m = 0; m < 60; m++) minuteEl.add(new Option(pad(m), pad(m)));
  function getStart() {
    if (startSel.some(s => !s.value)) return null;
    return (Number(hourEl.value) % 12 + (periodEl.value === 'PM' ? 12 : 0)) * 60 + Number(minuteEl.value);
  }
  function setStart(t) {
    if (t === null) { startSel.forEach(s => s.value = ''); return; }
    const h = Math.floor(wrap(t) / 60);
    hourEl.value = h % 12 || 12;
    minuteEl.value = pad(wrap(t) % 60);
    periodEl.value = h < 12 ? 'AM' : 'PM';
  }

  // Works out start/end from time spent; start defaults to now minus time spent
  function resolveTimes() {
    const dur = getMinutes();
    if (dur === null) return null;
    const entered = getStart();
    const start = entered ?? nowMin() - dur;
    return { dur, start, end: start + dur, source: entered === null ? 'defaulted' : startSource || 'entered' };
  }

  function updateSummary() {
    chips.forEach(c => c.classList.toggle('selected', Number(c.dataset.min) === getMinutes()));
    if (timerId) return;
    const t = resolveTimes();
    if (!t) { summaryEl.innerHTML = '&ndash;'; return; }
    summaryEl.innerHTML = `<strong>${t.dur} min</strong> &middot; ${fmt12(t.start)} &ndash; ${fmt12(t.end)}` +
      (t.source === 'defaulted' ? ' <em>(start time estimated)</em>' : '');
  }

  // Assumes the visit just ended: start = now minus time spent, until the user sets a start themselves
  function autoFillStart() {
    if (startSource !== null && startSource !== 'auto') return;
    const dur = getMinutes();
    setStart(dur === null ? null : nowMin() - dur);
    startSource = dur === null ? null : 'auto';
  }

  function setMinutes(n) {
    minEl.value = n;
    $('errTime').textContent = '';
    autoFillStart();
    updateSummary();
  }

  function setRunning(running) {
    timerBtn.innerHTML = running ? '&#9632; Stop timer' : '&#9654; Start timer';
    timerBtn.classList.toggle('running', running);
    minEl.readOnly = running;
    [...chips, ...steps].forEach(b => b.disabled = running);
  }

  function tick() {
    const s = Math.floor((Date.now() - timerStart) / 1000);
    summaryEl.innerHTML = `<strong>${Math.floor(s / 60)}m ${pad(s % 60)}s</strong> (running)`;
  }

  timerBtn.addEventListener('click', () => {
    if (!timerId) {
      timerStart = Date.now();
      setStart(nowMin());
      startSource = 'timer';
      minEl.value = '';
      $('errTime').textContent = '';
      updateSummary();
      setRunning(true);
      tick();
      timerId = setInterval(tick, 1000);
    } else {
      clearInterval(timerId);
      timerId = null;
      setRunning(false);
      setMinutes(Math.max(1, Math.round((Date.now() - timerStart) / 60000)));
    }
  });

  chips.forEach(c => c.addEventListener('click', () => setMinutes(Number(c.dataset.min))));
  $('minusBtn').addEventListener('click', () => setMinutes(Math.max(1, (getMinutes() ?? 2) - 1)));
  $('plusBtn').addEventListener('click', () => setMinutes((getMinutes() ?? 0) + 1));
  minEl.addEventListener('input', () => { $('errTime').textContent = ''; autoFillStart(); updateSummary(); });
  startSel.forEach(s => s.addEventListener('change', () => {
    if (!s.value) { setStart(null); startSource = null; } // picking "--" clears the whole time
    else {
      // Fill any still-blank dropdowns from the current hour, :00 and current AM/PM
      const h = Math.floor(nowMin() / 60);
      if (!hourEl.value) hourEl.value = h % 12 || 12;
      if (!minuteEl.value) minuteEl.value = '00';
      if (!periodEl.value) periodEl.value = h < 12 ? 'AM' : 'PM';
      startSource = 'entered';
    }
    updateSummary();
  }));
  setInterval(() => { if (getStart() === null) updateSummary(); }, 30000); // keep the estimated start current

  $('contactType').addEventListener('change', () => $('errType').textContent = '');
  $('noteTitle').addEventListener('change', () => $('errTitle').textContent = '');
  $('comments').addEventListener('input', () => $('errComments').textContent = '');

  function resetForm() {
    clearInterval(timerId); timerId = null; setRunning(false);
    minEl.value = $('comments').value = $('contactType').value = $('noteTitle').value = '';
    setStart(null);
    startSource = null;
    updateSummary();
    ['errType', 'errTitle', 'errTime', 'errComments', 'saved'].forEach(id => $(id).textContent = '');
  }
  $('cancelBtn').addEventListener('click', resetForm);
  $('closeBtn').addEventListener('click', resetForm);

  $('submitBtn').addEventListener('click', () => {
    let valid = true;
    $('saved').textContent = '';
    if (!$('contactType').value) { $('errType').textContent = 'Select a contact type'; valid = false; }
    if (!$('noteTitle').value) { $('errTitle').textContent = 'Select a note title'; valid = false; }
    if (timerId) { $('errTime').textContent = 'Stop the timer first'; valid = false; }
    else if (getMinutes() === null) { $('errTime').textContent = 'Enter time spent in whole minutes'; valid = false; }
    if (!$('comments').value.trim()) { $('errComments').textContent = 'Enter a comment'; valid = false; }
    if (!valid) return;

    const t = resolveTimes();
    const note = {
      date: $('noteDate').value,
      contactType: $('contactType').value,
      noteTitle: $('noteTitle').value,
      durationMinutes: t.dur,
      startTime: toTimeValue(t.start),
      endTime: toTimeValue(t.end),
      startTimeSource: t.source, // 'auto' | 'timer' | 'entered' | 'defaulted'
      comments: $('comments').value.trim()
    };
    console.log('Note payload:', note);
    $('saved').textContent = `Note saved: ${note.contactType}, ${note.durationMinutes} min (${fmt12(t.start)} – ${fmt12(t.end)})`;
  });
</script>
</body>
</html>
